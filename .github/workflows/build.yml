# SPDX-License-Identifier: MIT

# CI that builds and tests this vscode extension

name: build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          npm install --loglevel verbose
          npm install @vscode/vsce typescript -g

      - name: Checkout git-loom (main, unreleased)
        uses: actions/checkout@v7
        with:
          repository: narnaud/git-loom
          ref: main
          path: git-loom-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache git-loom cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-loom-src

      - name: Build and install git-loom
        run: |
          cd git-loom-src
          cargo build --release
          sudo mv target/release/git-loom /usr/local/bin/
          git-loom --version

      - name: Configure git identity (needed by the test repos loom creates)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: compile
        run: npm run compile

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test:unit

      - name: integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: integration tests (macOS)
        if: runner.os == 'macOS'
        run: npm test

      - name: vsce package
        run: vsce package
